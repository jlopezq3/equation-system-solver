<title>Equation System Solver for 3 Unknowns</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e40af,#2563eb);
    overflow:hidden;
}

body::before{
    content:"Ax=b   det(A)   x+y+z   λ   A⁻¹";
    position:absolute;
    width:100%;
    height:100%;
    color:rgba(255,255,255,.05);
    font-size:5rem;
    white-space:pre-wrap;
    text-align:center;
    top:20%;
    left:0;
}

.container{
    position:relative;
    z-index:1;
    width:90%;
    max-width:750px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:white;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h1{
    margin-bottom:10px;
    font-size:2.5rem;
}

.subtitle{
    color:#dbeafe;
    margin-bottom:30px;
}

.matrix{
    font-family:Consolas;
    font-size:1.2rem;
    margin-bottom:30px;
    color:#bfdbfe;
}

.btn{
    display:block;
    text-decoration:none;
    color:white;
    font-weight:bold;
    padding:15px;
    margin:12px auto;
    max-width:320px;
    border-radius:12px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.windows{
    background:#0078D7;
}

.mac{
    background:#555;
}

.web{
    background:#16a34a;
}
    
.github{
    background:#24292e;
}

.github:hover{
    background:#1b1f23;
}

.footer{
    margin-top:30px;
    color:#cbd5e1;
}

</style>
</head>

</p>
